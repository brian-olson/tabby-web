[tool.poetry]
name = "tabby-web"
version = "1.0.0"
description = "Tabby Web - an SSH/Telnet/Serial client in your browser"
authors = ["Eugeny <e@ajenti.org>"]

[tool.poetry.dependencies]
python = "^3.12"
Django = "^5.1"
djangorestframework = "^3.15"
djangorestframework-dataclasses = "^1.3"
social-auth-app-django = "^5.4"
python-dotenv = "^1.0"
websockets = "^14.1"
gql = "^3.5"
dj-database-url = "^2.2"
mysqlclient = "^2.2"
gunicorn = "^23.0"
Twisted = "^24.11"
semver = "^3.0"
requests = "^2.32"
pyga = "^2.6"
django-cors-headers = "^4.6"
cryptography = "^44.0"
fsspec = "^2024.12"
whitenoise = "^6.8"

[tool.poetry.dev-dependencies]
flake8 = "^7.1"
black = "^24.10"
pytest = "^8.3"
pytest-django = "^4.9"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
